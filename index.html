<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tejeshwar Vijayakumar — lowk.in</title>
  <meta name="description" content="Tejeshwar Vijayakumar (Tej) — solo founder of lowk.in, a nationwide platform for event discovery, ticketing and real-world networking. Built with AI-assisted development." />
  <meta name="author" content="Tejeshwar Vijayakumar" />
  <meta name="theme-color" content="#0C0D11" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tejeshwar Vijayakumar — lowk.in" />
  <meta property="og:description" content="Solo founder of lowk.in — event discovery, ticketing and real-world networking, built in a single particle canvas." />
  <meta property="og:site_name" content="Tejeshwar Vijayakumar" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Tejeshwar Vijayakumar — lowk.in" />
  <meta name="twitter:description" content="Solo founder of lowk.in — event discovery, ticketing and real-world networking." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#dock">Skip to controls</a>

  <!-- The single canvas is the whole site -->
  <canvas id="field" aria-hidden="true"></canvas>

  <!-- Text layer: name + caption. Lives above canvas, pointer-events none except links. -->
  <header class="wordmark" aria-hidden="false">
    <h1 class="name">Tejeshwar&nbsp;Vijayakumar</h1>
    <p class="role">Founder, <span class="lowk">lowk.in</span> · BITS&nbsp;Pilani&nbsp;Hyderabad</p>
  </header>

  <div class="caption" id="caption" role="status" aria-live="polite">
    <span class="caption-key" id="caption-key">About</span>
    <span class="caption-text" id="caption-text">Tejeshwar Vijayakumar — Tej, 18. Solo founder of lowk.in. I build calm software for real-world gatherings.</span>
  </div>

  <!-- Primary function buttons. Each demonstrates one lowk function. -->
  <nav class="dock" id="dock" aria-label="lowk functions">
    <button class="pill" data-mode="discover" data-key="1" aria-label="Discover — events across India">
      <span class="num">1</span>Discover</button>
    <button class="pill" data-mode="ticket" data-key="2" aria-label="Ticket — book and tear a ticket">
      <span class="num">2</span>Ticket</button>
    <button class="pill" data-mode="network" data-key="3" aria-label="Network — people meeting at events">
      <span class="num">3</span>Network</button>
    <button class="pill" data-mode="organise" data-key="4" aria-label="Organise — run a tournament bracket">
      <span class="num">4</span>Organise</button>
    <button class="pill" data-mode="about" data-key="5" aria-label="About — return to the portrait">
      <span class="num">5</span>About</button>
    <a class="pill" href="https://lowk.in" target="_blank" rel="noopener noreferrer" data-key="6" aria-label="Open lowk.in in a new tab">
      <span class="num">6</span>Open&nbsp;lowk.in</a>
    <a class="pill" href="mailto:7tejeshwar@gmail.com" data-key="7" aria-label="Contact Tejeshwar by email">
      <span class="num">7</span>Contact</a>
  </nav>

  <!-- Utility toggles -->
  <div class="utils" aria-label="Display options">
    <button class="util" id="invert" aria-pressed="false" aria-label="Invert palette (light / dark)">invert</button>
    <button class="util" id="reduce" aria-pressed="false" aria-label="Reduce particle count">fewer dots</button>
  </div>

  <div class="hint" id="hint" aria-hidden="true">press 1–7 · move the cursor through the field</div>

  <script src="./app.js"></script>
</body>
</html>
