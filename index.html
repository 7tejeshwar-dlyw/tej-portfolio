<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tejeshwar Vijayakumar — Founder, lowk.in</title>
  <meta name="description" content="Tejeshwar Vijayakumar (Tej) — solo founder of lowk.in, a nationwide platform for event discovery, ticketing and real-world networking. An interactive particle portrait built with AI-assisted development." />
  <meta name="author" content="Tejeshwar Vijayakumar" />
  <meta name="theme-color" content="#08090C" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tejeshwar Vijayakumar — Founder, lowk.in" />
  <meta property="og:description" content="An interactive particle portrait. Each formation demonstrates a function of lowk.in — discovery, ticketing, networking, organising." />
  <meta property="og:site_name" content="Tejeshwar Vijayakumar" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tejeshwar Vijayakumar — Founder, lowk.in" />
  <meta name="twitter:description" content="An interactive particle portrait built with AI-assisted development." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#index">Skip to navigation</a>

  <!-- The portrait: one canvas, ~16k particles -->
  <canvas id="field" aria-hidden="true"></canvas>

  <!-- Atmosphere -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Identity lockup (top-left) -->
  <header class="intro reveal">
    <p class="kicker" style="--d:0">Founder<span class="sep">/</span><span class="lowk">lowk.in</span></p>
    <h1 class="name"><span style="--d:1">Tejeshwar</span><span style="--d:2">Vijayakumar</span></h1>
    <p class="meta" style="--d:3">Eighteen · BITS&nbsp;Pilani, Hyderabad</p>
  </header>

  <!-- Function index (right) -->
  <nav class="index reveal" id="index" aria-label="lowk functions">
    <p class="index-label" style="--d:2">Explore</p>
    <ul>
      <li style="--d:3"><button class="fx" data-mode="discover" data-key="1" aria-label="Discover — events across India"><span class="n">01</span><span class="t">Discover</span></button></li>
      <li style="--d:4"><button class="fx" data-mode="ticket" data-key="2" aria-label="Ticket — book and tear a ticket"><span class="n">02</span><span class="t">Ticket</span></button></li>
      <li style="--d:5"><button class="fx" data-mode="network" data-key="3" aria-label="Network — people meeting at events"><span class="n">03</span><span class="t">Network</span></button></li>
      <li style="--d:6"><button class="fx" data-mode="organise" data-key="4" aria-label="Organise — run a tournament bracket"><span class="n">04</span><span class="t">Organise</span></button></li>
      <li style="--d:7"><button class="fx" data-mode="about" data-key="5" aria-label="About — return to the portrait"><span class="n">05</span><span class="t">About</span></button></li>
      <li class="rule" style="--d:8"></li>
      <li style="--d:9"><a class="fx" href="https://lowk.in" target="_blank" rel="noopener noreferrer" data-key="6" aria-label="Open lowk.in in a new tab"><span class="n">06</span><span class="t">Open lowk.in</span><span class="ext">↗</span></a></li>
      <li style="--d:10"><a class="fx" href="mailto:7tejeshwar@gmail.com" data-key="7" aria-label="Contact Tejeshwar by email"><span class="n">07</span><span class="t">Contact</span></a></li>
    </ul>
  </nav>

  <!-- Live caption (bottom-left) -->
  <div class="caption reveal" id="caption" role="status" aria-live="polite" style="--d:4">
    <span class="caption-key" id="caption-key">About</span>
    <span class="caption-text" id="caption-text">Tejeshwar Vijayakumar — Tej, 18. Solo founder of lowk.in. I build calm software for real-world gatherings.</span>
  </div>

  <!-- Controls (bottom bar) -->
  <div class="controls reveal" style="--d:11">
    <div class="utils" aria-label="Display options">
      <button class="util" id="invert" aria-pressed="false" aria-label="Invert palette (dark / light)">invert</button>
      <button class="util" id="reduce" aria-pressed="false" aria-label="Reduce particle count">fewer dots</button>
    </div>
    <p class="hint" id="hint" aria-hidden="true">press 1–7&nbsp;&nbsp;·&nbsp;&nbsp;drag through the portrait</p>
  </div>

  <script src="./app.js"></script>
</body>
</html>
